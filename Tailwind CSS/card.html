<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="w-200 mx-auto border-2 border-black rounded mt-20">
        <div
            class="h-20 bg-linear-to-r from-cyan-500 to-blue-500 text-white text-xl font-bold flex justify-center items-center">
            News you can Trust.
        </div>
        <div class="text-center w-200 mx-auto">
            <h3 class="font-semibold">Stay up to date with the latest news!!</h3>
            <p>Subscribe to our newsletter for latest news straight into your inbox.</p>
            <form class="flex flex-wrap">
                <input placeholder="your@email.com"
                    class="w-full mx-50 my-2 bg-slate-200 text-center rounded placeholder:text-sm p-1">
                <button class="w-full mx-85 bg-black text-white rounded-md">Subscribe now</button>
            </form>
            <p class="mx-6">We value your privacy.</p>
        </div>
    </div>
</body>

</html>
