<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic MongoDB Login Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>MongoDB Basic Demo</h1>
    <p id="dbStatus">Database Link: Checking...</p>

    <div class="form-section">
      <h2>Register</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="registerUsername">Username:</label>
          <input type="text" id="registerUsername" required>
        </div>
        <div class="form-group">
          <label for="registerPassword">Password:</label>
          <input type="password" id="registerPassword" required>
        </div>
        <button type="submit">Create Account</button>
      </form>
    </div>

    <div class="form-section">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginUsername">Username:</label>
          <input type="text" id="loginUsername" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password:</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <div class="form-section">
      <h2>All Users</h2>
      <button id="btnGetUsers">Fetch Users</button>
      <pre id="usersList" class="hidden" style="margin-top: 10px; background: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; max-height: 200px;"></pre>
    </div>

    <div id="messageBox" class="hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
